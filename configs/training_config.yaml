# Hiperparametros. Las rutas se resuelven desde configs/paths.yaml.

supervised:
  model: yolov8m.pt        # transfer learning desde COCO
  imgsz: 640
  batch: 16
  epochs: 50
  lr0: 0.01
  device: 0
  workers: 8
  seed: 42
  run_name: yolov8m_baseline

split:
  train: 0.70
  val: 0.15
  test: 0.15

rdd2022:
  countries: [Japan]       # subconjunto manejable (~10k imagenes)

unsupervised:
  mvtec_categories: [carpet, grid, metal_nut, tile]
  imgsz: 256
  autoencoder:
    epochs: 100
    batch: 32
    lr: 0.001
    latent_dim: 128
  patchcore:
    backbone: wide_resnet50_2
    layers: [layer2, layer3]
    coreset_sampling_ratio: 0.1

wandb:
  project: inspectai-industrial-cv
  entity: null
